baseURL = "https://blog.wenzl.no/"
defaultContentLanguage = "cs"
title = "Moravák v Norsku"

[languages]
  [languages.cs]
    locale = "cs-CZ"
    weight = 1

  [languages.en]
    locale = "en-US"
    weight = 2
    title = "Moravian in Norway"
    [languages.en.params]
      description = "Notes of a Moravian man living in the North"
      tagline = "notes from the far north"

  [languages.no]
    locale = "nb-NO"
    weight = 3
    title = "Moraver i Norge"
    [languages.no.params]
      description = "Notater fra en moraver som bor i nord"
      tagline = "notater fra den fjerne nord"

paginate = 10
summaryLength = 70

[taxonomies]
  category = "categories"
  tag      = "tags"

[params]
  description = "Zápisky moravského člověka žijícího na severu"
  author      = "Václav Wenzl"
  tagline     = "zápisky z dalekého severu"
  siteURL     = "https://blog.wenzl.no"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
