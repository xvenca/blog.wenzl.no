{{ define "main" }}
<div class="container">
  <header class="list-header">
    <h1>{{ .Title }}</h1>
  </header>
  {{ if .Pages }}
  <ol class="post-list" reversed>
    {{ range .Pages.ByDate.Reverse }}
    <li class="post-card">
      <div class="post-meta">
        <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2. 1. 2006" }}</time>
      </div>
      <h2 class="post-card__title"><a href="{{ .Permalink }}">{{ .Title }}</a></h2>
      {{ with .Summary }}<p class="post-card__summary">{{ . }}</p>{{ end }}
    </li>
    {{ end }}
  </ol>
  {{ else }}
  <p class="empty">Žádné zápisky v této kategorii.</p>
  {{ end }}
</div>
{{ end }}
