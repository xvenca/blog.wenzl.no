<header class="site-header">
  <div class="container">
    <div class="site-header__inner">
      <div class="site-brand">
        <a href="{{ "/" | relURL }}" class="site-brand__name">{{ .Site.Title }}</a>
        {{ with .Site.Params.tagline }}
        <p class="site-brand__tagline">{{ . }}</p>
        {{ end }}
      </div>
      <nav class="site-nav" aria-label="Navigace">
        <a href="{{ "/" | relURL }}"{{ if .IsHome }} class="active"{{ end }}>zápisky</a>
        <a href="{{ "/shorts/" | relURL }}"{{ if eq .Section "shorts" }} class="active"{{ end }}>shorts</a>
        <span class="site-nav__sep" aria-hidden="true"></span>
        {{- $currentLang := .Site.Language.Lang -}}
        {{- range .AllTranslations -}}
          <a href="{{ .RelPermalink }}" lang="{{ .Language.Lang }}" hreflang="{{ .Language.Lang }}"
             class="lang-link{{ if eq .Language.Lang $currentLang }} active{{ end }}">
            {{- .Language.Lang | upper -}}
          </a>
        {{- end -}}
      </nav>
    </div>
  </div>
</header>
